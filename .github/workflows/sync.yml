name: Sync from smileybones/film-site

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/smileybones/film-site.git
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*'

      - name: Mirror non-main branches (gh-pages, etc.)
        run: |
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/upstream); do
            branch=${ref#upstream/}
            if [ "$branch" != "main" ]; then
              git push origin "refs/remotes/upstream/$branch:refs/heads/$branch" --force
            fi
          done

      - name: Sync main while preserving this workflow file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/preserve/.github/workflows
          cp .github/workflows/sync.yml /tmp/preserve/.github/workflows/sync.yml

          git checkout main
          git rm -rf --ignore-unmatch . > /dev/null 2>&1
          git checkout upstream/main -- .

          mkdir -p .github/workflows
          cp /tmp/preserve/.github/workflows/sync.yml .github/workflows/sync.yml

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync main from smileybones/film-site"
            git push origin main
          fi
